<!DOCTYPE html>
<html lang="pt-BR" data-t="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>HUB DBM</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>try { document.documentElement.dataset.t = localStorage.getItem('dbm_t') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light') } catch (e) { }</script>
    <style>
        :root {
            --bg: #f3f5f9;
            --c: #fff;
            --tx: #1e293b;
            --mt: #64748b;
            --bd: #e2e8f0;
            --pr: #1d4ed8;
            --pr2: #e8eefc;
            --sb: #0f2a4a;
            --ok: #16a34a;
            --ok2: #dcfce7;
            --wn: #d97706;
            --wn2: #fef3c7;
            --er: #dc2626;
            --er2: #fee2e2;
            --vi: #7c3aed;
            --vi2: #ede9fe;
            --pk: #db2777;
            --pk2: #fce7f3;
            --sh: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 14px rgba(15, 23, 42, .05);
            --sbt: #cbd5e1
        }

        [data-t=dark] {
            --bg: #0b1220;
            --c: #111a2c;
            --tx: #e5edf8;
            --mt: #94a3b8;
            --bd: #22314a;
            --pr: #6c9cff;
            --pr2: #16264a;
            --sb: #08101d;
            --ok2: #12351f;
            --wn2: #3a2c0b;
            --er2: #3d1414;
            --vi: #a78bfa;
            --vi2: #2a1d4d;
            --pk: #f472b6;
            --pk2: #45142e;
            --sh: 0 1px 2px rgba(0, 0, 0, .4);
            --sbt: #334155
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 14px/1.45 Inter, system-ui, "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--tx)
        }

        .i {
            flex: none;
            vertical-align: -3px
        }

        button {
            font: inherit;
            cursor: pointer
        }

        #sd {
            position: fixed;
            inset: 0 auto 0 0;
            width: 250px;
            background: var(--sb);
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            z-index: 30;
            transition: transform .25s
        }

        .lg {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 18px 16px;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, .08)
        }

        .lg i {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--pr);
            display: grid;
            place-items: center;
            font-style: normal
        }

        .lg b {
            display: block;
            font-size: 15px
        }

        .lg small {
            opacity: .7;
            font-size: 11px
        }

        #nv {
            padding: 12px 10px;
            flex: 1;
            overflow: auto
        }

        #nv button {
            display: flex;
            gap: 11px;
            align-items: center;
            width: 100%;
            background: none;
            border: 0;
            color: inherit;
            padding: 10px 12px;
            border-radius: 9px;
            margin-bottom: 2px;
            text-align: left;
            font-weight: 500;
            transition: .15s
        }

        #nv button:hover {
            background: rgba(255, 255, 255, .07);
            color: #fff
        }

        #nv button.on {
            background: var(--pr);
            color: #fff
        }

        .sf {
            padding: 10px;
            border-top: 1px solid rgba(255, 255, 255, .08)
        }

        .sf button {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
            background: none;
            border: 0;
            color: #94a3b8;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px
        }

        .sf button:hover {
            color: #fff;
            background: rgba(255, 255, 255, .07)
        }

        #tp {
            position: sticky;
            top: 0;
            z-index: 20;
            margin-left: 250px;
            background: var(--c);
            border-bottom: 1px solid var(--bd);
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 24px
        }

        #mb {
            display: none;
            background: none;
            border: 0;
            color: var(--tx)
        }

        .gs {
            position: relative;
            flex: 1;
            max-width: 520px
        }

        .gs input,
        .sr input {
            width: 100%;
            padding: 9px 12px 9px 36px
        }

        .gs>.i,
        .sr>.i {
            position: absolute;
            left: 11px;
            top: 11px;
            color: var(--mt)
        }

        #gd {
            position: absolute;
            top: 44px;
            left: 0;
            right: 0;
            background: var(--c);
            border: 1px solid var(--bd);
            border-radius: 10px;
            box-shadow: var(--sh);
            overflow: hidden
        }

        #gd div,
        #gd a {
            display: flex;
            flex-direction: column;
            padding: 9px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--bd)
        }

        #gd div:hover,
        #gd a:hover {
            background: var(--pr2)
        }

        #gd span {
            color: var(--mt);
            font-size: 12px
        }

        #gd a {
            color: var(--pr);
            font-weight: 600;
            border: 0
        }

        main {
            margin-left: 250px;
            padding: 24px;
            animation: fu .35s
        }

        @keyframes fu {
            from {
                opacity: 0;
                transform: translateY(8px)
            }
        }

        .ph {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: 18px
        }

        .ph h2 {
            margin: 0;
            font-size: 22px
        }

        .ph p {
            margin: 2px 0 0;
            color: var(--mt)
        }

        .btn {
            display: inline-flex;
            gap: 7px;
            align-items: center;
            border: 1px solid var(--bd);
            background: var(--c);
            color: var(--tx);
            padding: 8px 13px;
            border-radius: 9px;
            font-weight: 600;
            transition: .15s
        }

        .btn:hover {
            border-color: var(--pr);
            color: var(--pr)
        }

        .btn.p {
            background: var(--pr);
            border-color: var(--pr);
            color: #fff
        }

        .btn.p:hover {
            filter: brightness(1.1);
            color: #fff
        }

        .btn.s {
            padding: 4px 9px;
            font-size: 13px
        }

        .btn.d {
            color: var(--er)
        }

        .btn:disabled {
            opacity: .4;
            cursor: default
        }

        input,
        select,
        textarea {
            font: inherit;
            padding: 8px 10px;
            border: 1px solid var(--bd);
            border-radius: 9px;
            background: var(--c);
            color: var(--tx);
            max-width: 100%
        }

        input:focus,
        select:focus {
            outline: 2px solid var(--pr2);
            border-color: var(--pr)
        }

        .kp {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 14px;
            margin-bottom: 18px
        }

        .k {
            display: flex;
            gap: 14px;
            align-items: center;
            background: var(--c);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 16px;
            box-shadow: var(--sh);
            transition: .2s;
            --a: var(--pr);
            --a2: var(--pr2)
        }

        .k:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(15, 23, 42, .12);
            border-color: var(--a)
        }

        .k.g {
            --a: var(--ok);
            --a2: var(--ok2)
        }

        .k.y {
            --a: var(--wn);
            --a2: var(--wn2)
        }

        .k.r {
            --a: var(--er);
            --a2: var(--er2)
        }

        .k.v {
            --a: #7c3aed;
            --a2: #ede9fe
        }

        .ki {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: var(--a2);
            color: var(--a);
            display: grid;
            place-items: center;
            flex: none
        }

        .k span {
            color: var(--mt);
            font-size: 12.5px;
            display: block
        }

        .k b {
            font-size: 26px;
            line-height: 1.15;
            display: block
        }

        .k em {
            font-style: normal;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            gap: 4px;
            align-items: center;
            color: var(--mt)
        }

        .k em.up {
            color: var(--ok)
        }

        .k em.dn {
            color: var(--er)
        }

        .dg {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 18px;
            align-items: start
        }

        .dg>div:first-child {
            display: grid;
            gap: 18px;
            min-width: 0
        }

        .side {
            position: sticky;
            top: 70px
        }

        .cd {
            background: var(--c);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 16px;
            box-shadow: var(--sh)
        }

        .cd h3 {
            margin: 0 0 12px;
            font-size: 15px;
            display: flex;
            gap: 8px;
            align-items: center
        }

        .g2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 18px
        }

        .br {
            display: grid;
            grid-template-columns: 110px 1fr 34px;
            gap: 8px;
            align-items: center;
            margin: 8px 0;
            font-size: 12.5px
        }

        .br div {
            background: var(--bg);
            border-radius: 6px;
            height: 14px;
            overflow: hidden
        }

        .br i {
            display: block;
            height: 100%;
            border-radius: 6px;
            animation: gw .7s;
            transform-origin: left;
            transition: .2s
        }

        .br:hover i {
            filter: brightness(1.15)
        }

        .br em {
            font-style: normal;
            font-weight: 700;
            text-align: right
        }

        @keyframes gw {
            from {
                transform: scaleX(0)
            }
        }

        .ch {
            width: 100%
        }

        .ch text {
            font-size: 10px;
            fill: var(--mt)
        }

        .b1,
        .b2 {
            transform-box: fill-box;
            transform-origin: bottom;
            animation: gh .7s;
            transition: .15s
        }

        .b1 {
            fill: var(--pr)
        }

        .b2 {
            fill: var(--ok)
        }

        .bg:hover rect {
            filter: brightness(1.2)
        }

        @keyframes gh {
            from {
                transform: scaleY(0)
            }
        }

        .lgd {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: var(--mt);
            margin-top: 4px
        }

        .lgd i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            margin-right: 5px
        }

        .dn {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap
        }

        .dn svg {
            width: 140px;
            flex: none
        }

        .sg {
            transition: .2s;
            animation: gd .8s
        }

        .sg:hover {
            stroke-width: 7.5
        }

        .dt {
            font-size: 7px;
            font-weight: 700;
            fill: var(--tx)
        }

        @keyframes gd {
            from {
                opacity: 0
            }
        }

        .dn div div {
            font-size: 13px;
            margin: 4px 0
        }

        .dn i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            margin-right: 6px
        }

        .pl {
            max-height: calc(100vh - 190px);
            overflow: auto;
            display: grid;
            gap: 8px
        }

        .pi {
            display: grid;
            grid-template-columns: 54px 1fr;
            gap: 10px;
            border: 1px solid var(--bd);
            border-left: 4px solid var(--ok);
            border-radius: 10px;
            padding: 9px;
            cursor: pointer;
            transition: .15s
        }

        .pi:hover {
            background: var(--pr2)
        }

        .pi.c {
            border-left-color: var(--er)
        }

        .pi.a {
            border-left-color: var(--wn)
        }

        .pd {
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 18px;
            line-height: 1;
            text-align: center;
            background: var(--ok2);
            color: var(--ok)
        }

        .pi.c .pd {
            background: var(--er2);
            color: var(--er)
        }

        .pi.a .pd {
            background: var(--wn2);
            color: var(--wn)
        }

        .pd small {
            font-size: 9px;
            font-weight: 600;
            display: block
        }

        .pm {
            min-width: 0;
            font-size: 12px;
            color: var(--mt)
        }

        .pm b {
            display: block;
            color: var(--tx);
            font-size: 12.5px;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .pm span {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .bd {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 20px;
            background: var(--pr2);
            color: var(--pr);
            white-space: nowrap;
            margin-top: 3px
        }

        .bd.g {
            background: var(--ok2);
            color: var(--ok)
        }

        .bd.y {
            background: var(--wn2);
            color: var(--wn)
        }

        .bd.r {
            background: var(--er2);
            color: var(--er)
        }

        .rgg {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr));
            gap: 18px;
            align-items: start
        }

        .rgg .rgw {
            grid-column: 1/-1
        }

        .rgt th.n,
        .rgt td.n {
            text-align: right
        }

        .rgt tbody tr {
            cursor: default
        }

        .rgt tr.tot td {
            font-weight: 700;
            background: var(--pr2)
        }

        .rb {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px
        }

        .rb i {
            display: block;
            height: 8px;
            max-width: 60%;
            background: var(--pr);
            border-radius: 4px
        }

        .bd.n {
            background: var(--bg);
            color: var(--mt)
        }

        .ng {
            padding: 14px 12px 4px;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #64748b
        }

        .tb {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 12px
        }

        .sr {
            position: relative;
            flex: 1;
            min-width: 240px
        }

        .cnt {
            background: var(--pr);
            color: #fff;
            border-radius: 10px;
            padding: 0 6px;
            font-size: 11px
        }

        .cnt:empty {
            display: none
        }

        .fg {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
            background: var(--bg);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            align-items: end
        }

        .fg label {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--mt);
            display: grid;
            gap: 3px;
            min-width: 0
        }

        .fg select,
        .fg input {
            width: 100%;
            min-width: 0;
            text-overflow: ellipsis
        }

        .tw {
            overflow-x: auto;
            border: 1px solid var(--bd);
            border-radius: 10px
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px
        }

        th {
            background: var(--bg);
            color: var(--mt);
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: .03em;
            position: sticky;
            top: 0
        }

        th,
        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--bd);
            text-align: left;
            white-space: nowrap
        }

        td.wr {
            white-space: normal;
            min-width: 190px
        }

        .tw th,
        .tw td {
            text-align: center;
            vertical-align: middle
        }

        .tw th.tl,
        .tw td.tl {
            text-align: left
        }

        tbody tr {
            cursor: pointer;
            transition: .12s
        }

        tbody tr:hover {
            background: var(--pr2)
        }

        tbody tr.w td:first-child {
            box-shadow: inset 4px 0 var(--wn)
        }

        tbody tr.r td:first-child {
            box-shadow: inset 4px 0 var(--er)
        }

        .pgr {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: flex-end;
            padding-top: 12px;
            color: var(--mt)
        }

        .pgr b {
            color: var(--tx)
        }

        .nt {
            color: var(--mt);
            font-size: 12.5px
        }

        .vc {
            display: grid;
            grid-template-columns: 62px 1fr auto;
            gap: 12px;
            align-items: center;
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: .15s
        }

        .vc:hover {
            border-color: var(--pr);
            transform: translateX(2px)
        }

        .vc .pd {
            height: 56px
        }

        .vc .pm div {
            margin: 1px 0
        }

        .bar {
            height: 6px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px
        }

        .bar i {
            display: block;
            height: 100%;
            animation: gw .7s;
            transform-origin: left
        }

        .sg2 {
            display: inline-flex;
            background: var(--c);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 16px
        }

        .sg2 button {
            border: 0;
            background: none;
            padding: 6px 14px;
            border-radius: 8px;
            color: var(--mt);
            font-weight: 600
        }

        .sg2 button.on {
            background: var(--pr);
            color: #fff
        }

        .rp {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 10px;
            margin-bottom: 14px
        }

        .rp button {
            text-align: left;
            background: var(--c);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 12px;
            color: var(--tx);
            font-weight: 600;
            display: flex;
            gap: 8px;
            align-items: center
        }

        .rp button.on {
            border-color: var(--pr);
            background: var(--pr2);
            color: var(--pr)
        }

        .ib {
            background: var(--pr2);
            border-left: 4px solid var(--pr);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 14px
        }

        .br2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid var(--bd);
            font-size: 13px
        }

        .lst {
            max-height: 300px;
            overflow: auto
        }

        dialog {
            border: 0;
            border-radius: 16px;
            padding: 0;
            width: min(680px, 94vw);
            background: var(--c);
            color: var(--tx);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35)
        }

        dialog {
            max-height: min(90vh, 900px);
            overflow-y: auto;
            overscroll-behavior: contain
        }

        dialog h2 {
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--c)
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--sbt) transparent
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        dialog::-webkit-scrollbar-track {
            margin: 14px 0
        }

        ::-webkit-scrollbar-thumb {
            background: var(--sbt);
            border-radius: 10px;
            border: 3px solid transparent;
            background-clip: padding-box
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--mt)
        }

        dialog::backdrop {
            background: rgba(8, 16, 29, .6);
            backdrop-filter: blur(2px)
        }

        dialog h2 {
            margin: 0;
            padding: 15px 20px;
            font-size: 17px;
            border-bottom: 1px solid var(--bd);
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .fm {
            padding: 16px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .fm label {
            font-size: 12px;
            color: var(--mt);
            font-weight: 600;
            display: grid;
            gap: 3px
        }

        .fm .w {
            grid-column: 1/-1
        }

        .ac {
            padding: 0 20px 18px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .sp {
            flex: 1
        }

        .dl {
            padding: 16px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .dl div {
            font-size: 12px;
            color: var(--mt)
        }

        .dl b {
            display: block;
            color: var(--tx);
            font-size: 14px;
            font-weight: 600
        }

        .tl {
            margin: 0 20px 16px;
            border-left: 2px solid var(--bd);
            padding-left: 16px
        }

        .tl div {
            position: relative;
            padding: 4px 0 10px
        }

        .tl div:before {
            content: "";
            position: absolute;
            left: -23px;
            top: 8px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--pr)
        }

        .tl small {
            color: var(--mt);
            display: block
        }

        [hidden] {
            display: none !important
        }

        .kt {
            margin: 6px 0 10px;
            font-size: 14px;
            color: var(--mt);
            display: flex;
            gap: 8px;
            align-items: center
        }

        .k[onclick] {
            cursor: pointer
        }

        .me {
            padding: 6px 12px 10px;
            font-size: 12px;
            color: #94a3b8
        }

        .me b {
            display: block;
            color: #fff;
            font-size: 13px
        }

        .ds {
            margin: 0 20px 14px;
            font-size: 12px;
            color: var(--mt)
        }

        .ds b {
            display: block;
            color: var(--tx);
            font-size: 14px;
            font-weight: 500;
            white-space: pre-wrap
        }

        .hm {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr));
            gap: 12px;
            margin-bottom: 18px
        }

        .hm button {
            display: flex;
            gap: 12px;
            align-items: center;
            text-align: left;
            background: var(--c);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 14px;
            color: var(--tx);
            box-shadow: var(--sh);
            cursor: pointer;
            font: inherit;
            transition: .15s
        }

        .hm button:hover {
            border-color: var(--pr);
            background: var(--pr2)
        }

        .hm .ki {
            flex: none;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: var(--pr2);
            color: var(--pr)
        }

        .hm b {
            display: block;
            font-size: 14px
        }

        .hm small {
            color: var(--mt);
            font-size: 12px
        }

        .hg {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
            gap: 18px;
            align-items: start
        }

        .hg .kt small {
            font-weight: 400;
            font-size: 12px
        }

        .pdia {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--mt);
            padding: 6px 0 0
        }

        .evx {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 3px
        }

        @media(max-width:700px) {
            .evx {
                grid-template-columns: 1fr
            }

            .hm {
                grid-template-columns: 1fr 1fr;
                gap: 8px
            }

            .hm button {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                padding: 10px
            }

            .hm .ki {
                width: 34px;
                height: 34px
            }
        }

        .pm .evb {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 2px 0
        }

        .pm .evb .bd {
            display: inline-flex;
            margin: 0
        }

        .cat {
            min-width: 160px;
            text-align: center;
            font-size: 15px
        }

        .clg {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--mt);
            margin-bottom: 10px
        }

        .clg i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            margin-right: 5px;
            vertical-align: -1px;
            background: var(--a)
        }

        .ctR {
            --a: var(--pr);
            --b: var(--pr2)
        }

        .ctT {
            --a: var(--wn);
            --b: var(--wn2)
        }

        .ctF {
            --a: var(--ok);
            --b: var(--ok2)
        }

        .ctH {
            --a: var(--er);
            --b: var(--er2)
        }

        .cdia.fer .cn {
            color: var(--er)
        }

        .cdia.hj.fer .cn {
            color: #fff
        }

        .ctA {
            --a: var(--mt);
            --b: var(--bg)
        }

        .ctO {
            --a: var(--vi);
            --b: var(--vi2)
        }

        .ctN {
            --a: var(--pk);
            --b: var(--pk2)
        }

        .cev,
        .bd.ctR,
        .bd.ctT,
        .bd.ctO,
        .bd.ctF,
        .bd.ctA,
        .bd.ctH,
        .bd.ctN {
            background: var(--b);
            color: var(--a)
        }

        .cgrid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            border: 1px solid var(--bd);
            border-radius: 10px;
            overflow: hidden
        }

        .cds {
            padding: 6px 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--mt);
            background: var(--bg);
            border-bottom: 1px solid var(--bd)
        }

        .cdia {
            min-height: 106px;
            min-width: 0;
            padding: 4px 5px 6px;
            border-right: 1px solid var(--bd);
            border-bottom: 1px solid var(--bd);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 3px
        }

        .cdia:nth-child(7n) {
            border-right: 0
        }

        .cdia:hover {
            background: var(--pr2)
        }

        .cdia.fo {
            background: var(--bg)
        }

        .cdia.fo .cn {
            opacity: .5
        }

        .cn {
            font-size: 12px;
            font-weight: 700;
            color: var(--mt);
            align-self: flex-end;
            width: 24px;
            height: 24px;
            display: grid;
            place-items: center;
            border-radius: 50%
        }

        .cdia.hj .cn {
            background: var(--pr);
            color: #fff
        }

        .cev {
            font-size: 11px;
            line-height: 1.35;
            padding: 2px 6px;
            border-radius: 5px;
            border-left: 3px solid var(--a);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .cev.cx {
            text-decoration: line-through;
            opacity: .6
        }

        .cmais {
            font-size: 11px;
            color: var(--pr);
            font-weight: 600;
            padding: 0 4px
        }

        .pi.ce {
            border-left-color: var(--a)
        }

        .pi.ce .pd {
            background: var(--b);
            color: var(--a);
            font-size: 14px
        }

        .csem {
            display: grid;
            gap: 12px
        }

        .csd {
            display: grid;
            gap: 6px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--bd)
        }

        .csd h4 {
            margin: 0;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: capitalize;
            color: var(--mt)
        }

        .csd h4 .btn {
            margin-left: auto
        }

        .csd.hj h4 {
            color: var(--pr)
        }

        .lb {
            font-size: 12px;
            color: var(--mt);
            font-weight: 600
        }

        .evp {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 4px 12px;
            max-height: 180px;
            overflow: auto;
            border: 1px solid var(--bd);
            border-radius: 9px;
            padding: 8px 10px;
            margin-top: 3px
        }

        .fm .evp label,
        .fm label.ck {
            display: flex;
            gap: 8px;
            align-items: center;
            font-weight: 500;
            color: var(--tx);
            font-size: 13px
        }

        .fm input[type=checkbox] {
            width: auto;
            padding: 0;
            margin: 0
        }

        .ax {
            margin: 0 20px 16px;
            display: grid;
            gap: 6px
        }

        .ax>div {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--bd);
            border-radius: 9px;
            padding: 6px 8px
        }

        .ax .bd {
            margin: 0
        }

        .axn {
            flex: 1;
            min-width: 0
        }

        .axn b {
            display: block;
            font-size: 13px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .axn small {
            color: var(--mt);
            font-size: 11px
        }

        @media(max-width:700px) {
            .cdia {
                min-height: 62px;
                padding: 2px
            }

            .cev {
                font-size: 0;
                height: 6px;
                padding: 0;
                border-left: 0;
                border-radius: 3px;
                background: var(--a)
            }

            .cev b {
                display: none
            }

            .cmais {
                font-size: 10px;
                padding: 0
            }

            .cat {
                min-width: 0;
                font-size: 13px
            }
        }

        @media(max-width:1100px) {
            .dg {
                grid-template-columns: 1fr
            }

            .side {
                position: static
            }

            .pl {
                max-height: none
            }
        }

        @media(max-width:900px) {
            #sd {
                transform: translateX(-100%)
            }

            #sd.o {
                transform: none
            }

            #tp,
            main {
                margin-left: 0
            }

            #mb {
                display: block
            }

            #tp {
                padding: 10px 14px
            }

            #tp .sp {
                display: none
            }

            #tp .gs {
                min-width: 0
            }

            main {
                padding: 16px 14px
            }

            .fm,
            .dl {
                grid-template-columns: 1fr
            }

            .tp-t {
                display: none
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <aside id="sd">
        <div class="lg"><i></i>
            <div><b>HUB PATRIMONIAL</b><small>Gestão e Controle</small></div>
        </div>
        <nav id="nv"></nav>
        <div class="sf"><button onclick="xl()"></button><button onclick="bk()"></button><button
                onclick="openImp()"></button></div>
    </aside>
    <header id="tp"><button id="mb" onclick="$('#sd').classList.toggle('o')"></button>
        <div class="gs"><input id="gq" placeholder="Busca rápida em todos os processos…" oninput="gq(this.value)"
                autocomplete="off">
            <div id="gd" hidden></div>
        </div><span class="sp"></span>
        <button class="btn" id="bt" onclick="th()" title="Alternar tema"></button><button class="btn"
            onclick="atEd(0)" id="ba" title="Novo atendimento"></button><button class="btn p" onclick="edit(0)" id="bn"
            title="Novo processo"></button>
    </header>
    <main id="mn"></main>
    <dialog id="dg">
        <h2><span id="dt"></span></h2>
        <div class="fm" id="fm"></div>
        <div class="ac" id="ac"></div>
    </dialog>
    <dialog id="dd"></dialog>
    <dialog id="lg" oncancel="event.preventDefault()" style="width:min(400px,92vw)">
        <h2 id="lgt">Acesso ao sistema</h2>
        <form id="lgf" class="fm" style="grid-template-columns:1fr">
            <div id="lgs" class="ib" style="margin:0">Primeiro acesso: cadastre o administrador do sistema. A chave de
                instalação é o valor da variável APP_PASSWORD configurada na Vercel.</div>
            <label data-s>Chave de instalação<input type="password" id="lgk" autocomplete="off"></label>
            <label data-s>Nome completo<input id="lgn" autocomplete="name" maxlength="100"></label>
            <label>Login<input id="lgl" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
            <label>Senha<input type="password" id="lgp" autocomplete="current-password"></label>
            <p class="nt" id="lge" role="alert" style="color:var(--er);margin:0"></p>
            <button class="btn p">Entrar</button>
        </form>
    </dialog>
    <script src="/xlsx.min.js"></script>
    <script src="/js/base.js"></script>
    <script src="/js/processos.js"></script>
    <script src="/js/atendimentos.js"></script>
    <script src="/js/relatorios.js"></script>
    <script src="/js/calendario.js"></script>
    <script src="/js/inicio.js"></script>
    <script src="/js/usuarios.js"></script>
    <script src="/js/app.js"></script>
</body>

</html>
